name: Build (Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android:
    needs: [qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter pub get

      # Sans clé permanente, l'APK produit serait signé avec une clé de debug
      # regénérée à chaque run : impossible de mettre à jour une installation
      # existante sans désinstaller (et donc perdre les estimations).
      # On échoue tôt et bruyamment plutôt que de livrer un APK piégé.
      - name: Restaure le keystore (si le secret existe)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — APK signe avec la cle de debug."
            echo "::warning::Il ne pourra pas remplacer une installation existante. Voir docs/signature-android.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.p12
          {
            printf 'storeFile=upload-keystore.p12\n'
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
          } > android/key.properties

      # --target-platform est le seul levier qui filtre reellement les ABI :
      # abiFilters cote Gradle est ignore par le plugin Flutter, l APK
      # embarquait donc arm64-v8a + armeabi-v7a + x86_64, soit ~70 Mo de
      # binaires natifs inutiles sur un telephone recent.
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      # Trace l'empreinte SHA-256 du certificat : elle doit rester identique
      # d'une release à l'autre, sinon les mises à jour seront refusées.
      - name: Empreinte du certificat de signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -n1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - name: Nettoie les secrets du runner
        if: always()
        run: rm -f android/app/upload-keystore.p12 android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: EstimPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EstimPro-APK
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EstimPro v1.0.${{ github.run_number }}
          files: artifacts/*
          body: |
            ## EstimPro — App estimation immobilière
            **Faucigny Immobilier by Efficity — Jérémy Moraga**

            📱 **Android** : télécharge `app-release.apk` et installe directement sur ton Samsung.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
