name: Build (Android + iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  android:
    needs: [qa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter pub get

      # Sans clé permanente, l'APK produit serait signé avec une clé de debug
      # regénérée à chaque run : impossible de mettre à jour une installation
      # existante sans désinstaller (et donc perdre les estimations).
      # On échoue tôt et bruyamment plutôt que de livrer un APK piégé.
      - name: Restaure le keystore (si le secret existe)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — APK signe avec la cle de debug."
            echo "::warning::Il ne pourra pas remplacer une installation existante. Voir docs/signature-android.md."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release

      # Trace l'empreinte SHA-256 du certificat : elle doit rester identique
      # d'une release à l'autre, sinon les mises à jour seront refusées.
      - name: Empreinte du certificat de signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -n1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"

      - name: Nettoie les secrets du runner
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: EstimPro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: [qa]
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - run: flutter pub get

      - name: Generate iOS project
        run: flutter create --platforms=ios --org com.faucigny .

      - name: Configure permissions & iPad support
        run: |
          PLIST="ios/Runner/Info.plist"
          add_or_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 '$2'" "$PLIST"
          }
          add_or_set NSMicrophoneUsageDescription "Note vocale pour estimation immobilière"
          add_or_set NSSpeechRecognitionUsageDescription "Transcription de vos notes vocales"
          add_or_set NSPhotoLibraryUsageDescription "Ajouter des photos du bien à estimer"
          add_or_set NSPhotoLibraryAddUsageDescription "Sauvegarder des photos de l'estimation"
          add_or_set NSCameraUsageDescription "Prendre des photos du bien immobilier"
          add_or_set NSLocationWhenInUseUsageDescription "Détection automatique de l'adresse du bien lors de la visite"

          # iPad: support portrait + paysage
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationPortraitUpsideDown" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:3 string UIInterfaceOrientationLandscapeRight" "$PLIST"

          # Minimum iOS 13 (requis par les packages)
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$PLIST" 2>/dev/null || true

      - name: Set iOS deployment target
        run: |
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 13.0/g" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build IPA (non signé)
        run: flutter build ipa --release --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: EstimPro-IPA
          path: build/ios/ipa/*.ipa

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EstimPro-APK
          path: artifacts/

      - name: Download IPA (si disponible)
        uses: actions/download-artifact@v4
        with:
          name: EstimPro-IPA
          path: artifacts/
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EstimPro v1.0.${{ github.run_number }}
          files: artifacts/*
          body: |
            ## EstimPro — App estimation immobilière
            **Faucigny Immobilier by Efficity — Jérémy Moraga**

            📱 **Android** : télécharge `app-release.apk` et installe directement sur ton Samsung
            🍎 **iOS / iPad** : télécharge `*.ipa` — installation via **AltStore** ou **Sideloadly** (gratuit, valable 7 jours) ou TestFlight avec compte Apple Developer

            > L'IPA est non signé. Pour une installation permanente sans re-signer, un compte Apple Developer (99€/an) est nécessaire.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
