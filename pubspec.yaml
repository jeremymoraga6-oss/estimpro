name: estimpro
description: Estimation immobilière terrain — Faucigny Immobilier by Efficity
publish_to: 'none'
version: 1.3.1+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.2
  pdf: ^3.10.8
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  share_plus: ^10.0.0
  http: ^1.2.1
  open_file: ^3.5.7
  record: ^6.2.0
  speech_to_text: ^7.3.0
  archive: ^3.6.1
  file_picker: ^8.0.7
  pdfrx: ^1.0.0
  google_mlkit_text_recognition: ^0.13.0
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  wakelock_plus: ^1.2.8
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/docs/
    - assets/fonts/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Italic.ttf
          style: italic
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
